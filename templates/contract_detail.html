<!DOCTYPE html>
<html>
<head>
    <title>Contract Details</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1e40af;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            margin-top: 15px;
            display: block;
            color: #1e293b;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            margin-top: 25px;
            padding: 14px 30px;
            background: linear-gradient(135deg, #1e40af, #1e3a8a);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            opacity: 0.9;
        }
        .back {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #1e40af;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">

    <h1>{{ contract.project_name }}</h1>

    <p><strong>State:</strong> {{ contract.primary_state }}</p>
    <p><strong>Length (km):</strong> {{ contract.estimated_length_km }}</p>
    <p><strong>Terrain:</strong> {{ contract.terrain_type }}</p>
    <p><strong>Rainfall:</strong> {{ contract.rainfall_mm_per_year }} mm/year</p>

    <hr style="margin: 30px 0;">

    <h2 style="color:#0f172a;">Submit Your Bid</h2>

    <!-- ⭐ THIS IS THE FIXED FORM ⭐ -->
    <form action="/contracts/{{ contract_id }}/submit_bid" method="POST">

        <!-- Hidden fields (backend overrides these if user is logged in) -->
        <input type="hidden" name="company_name" value="{{ contract.company_name if contract.company_name else '' }}">
        <input type="hidden" name="cac_number" value="{{ contract.cac_number if contract.cac_number else '' }}">
        <input type="hidden" name="email" value="{{ contract.email if contract.email else '' }}">

        <label>Phone Number</label>
        <input type="text" name="phone" placeholder="Enter phone number" required>

        <label>Bid Amount (Billions ₦)</label>
        <input type="text" name="bid_amount" placeholder="Example: 12.5" required>

        <label>Equipment List</label>
        <textarea name="equipment_list" placeholder="List your equipment..." required></textarea>

        <label>Workforce Description</label>
        <textarea name="workforce" placeholder="Describe your workforce..." required></textarea>

        <button type="submit">Submit Bid</button>
    </form>

    <a href="/contracts" class="back">← Back to Contracts</a>

</div>

</body>
</html>
