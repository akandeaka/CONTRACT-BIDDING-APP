

```html
{% for contract in contracts %}
<div class="feature-card">
    <div class="feature-icon">
        <i class="fas fa-file-contract"></i>
    </div>
    <h3>{{ contract.project_name }}</h3>
    <p><strong>Location:</strong> {{ contract.primary_state }}</p>
    <p><strong>Length:</strong> {{ "%.2f"|format(contract.estimated_length_km) }} km</p>
    <p><strong>Terrain:</strong> {{ contract.terrain_type }}</p>
    <p><strong>Geopolitical Zone:</strong> {{ contract.geopolitical_zone }}</p>
    
    <form onsubmit="submitBid({{ loop.index0 }}, event)" style="margin-top: 15px;">
        <input type="hidden" name="user_id" value="1" />
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
            <input type="email" name="email" placeholder="Your Email" required style="padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
            <input type="tel" name="phone" placeholder="Phone" required style="padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
        </div>
        <input type="number" step="0.01" name="bid_amount" placeholder="Your Bid Amount (₦ Billion)" required style="width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px;">
        <textarea name="equipment_list" placeholder="Equipment List" required style="width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; height: 60px;"></textarea>
        <textarea name="workforce" placeholder="Workforce Details" required style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 4px; height: 60px;"></textarea>
        <button type="submit" class="btn btn-primary" style="width: 100%;">
            Submit Bid
        </button>
    </form>
</div>
{% endfor %}
```
